<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Éval PSE">
</head>
<body>
<title>Évaluations PSE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#002b6b">
<style>@font-face{font-family:'Montserrat';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/montserrat-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/montserrat-latin-800-normal.woff2) format('woff2')}
</style>
<style>
/* Layout : application une colonne aux couleurs UDPS 28 (marine + rouge), barre du haut collante + navigation basse ; grilles en tableau sur tablette, en cartes sur téléphone. */
:root{
  --bg:#f4f7fa; --surface:#ffffff; --surface-2:#f5f7fa; --ink:#1f2937; --muted:#5b6b80; --line:#d7e1ea;
  --brand:#002b6b; --brand-ink:#ffffff; --brand-soft:#e3eaf5; --brand-deep:#001d39;
  --accent:#e30613; --accent-ink:#ffffff; --alert:#c10435;
  --t-vertf:#17643a; --t-vert:#2f8a47; --t-orange:#c97a12; --t-rouge:#c10435; --t-bleu:#064d94; --t-gris:#7b8594;
  --f-display:"Montserrat",Arial,system-ui,sans-serif;
  --f-body:"Montserrat",Arial,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(0,43,107,.06),0 2px 10px rgba(0,43,107,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1422; --surface:#13203a; --surface-2:#182844; --ink:#e7edf5; --muted:#9db0c8; --line:#263f5c;
  --brand:#7fa8e6; --brand-ink:#001d39; --brand-soft:#1b3157; --brand-deep:#001d39;
  --accent:#ff4b55; --accent-ink:#ffffff; --alert:#ff6b7a;
  --t-vertf:#2f9a5c; --t-vert:#4fb468; --t-orange:#e09a35; --t-rouge:#ff5a66; --t-bleu:#5b93e0; --t-gris:#8792a3;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1422; --surface:#13203a; --surface-2:#182844; --ink:#e7edf5; --muted:#9db0c8; --line:#263f5c;
  --brand:#7fa8e6; --brand-ink:#001d39; --brand-soft:#1b3157; --brand-deep:#001d39;
  --accent:#ff4b55; --accent-ink:#ffffff; --alert:#ff6b7a;
  --t-vertf:#2f9a5c; --t-vert:#4fb468; --t-orange:#e09a35; --t-rouge:#ff5a66; --t-bleu:#5b93e0; --t-gris:#8792a3;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#002b6b}

.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#002b6b;color:#fff;border-bottom:3px solid #e30613}
.top .wrap{display:flex;align-items:center;gap:8px;min-height:56px;padding-block:6px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:1.08rem;letter-spacing:.005em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-weight:500;font-size:.74rem;opacity:.85;display:block;overflow:hidden;text-overflow:ellipsis}
.mark{width:36px;height:36px;border-radius:8px;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mark img{width:32px;height:32px}
.ibtn{border:0;background:transparent;color:inherit;min-width:44px;height:44px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-weight:600;flex:none}
.ibtn:hover{background:rgba(255,255,255,.12)}
.ibtn svg{width:22px;height:22px}
.ibtn.solid{background:#e30613;color:#fff}
@media (max-width:440px){.ibtn .lbl{display:none}}

main{padding-block:16px 130px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;font-weight:600;color:var(--muted);min-height:58px;position:relative}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--brand)}
.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:12px}
h3{font-family:var(--f-display);font-weight:700;font-size:1rem;margin:0;color:var(--brand);text-wrap:balance}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.num{font-variant-numeric:tabular-nums}

.brandband{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow)}
.brandband img{height:58px;width:auto;flex:none}
.brandband .t{font-weight:700;color:#002b6b;font-size:.95rem;line-height:1.25}
.brandband .t span{display:block;font-weight:500;color:#5b6b80;font-size:.8rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel>.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>.hd>h3{flex:1 0 auto}
.panel>.bd{padding:14px}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
label.f{display:grid;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;min-height:46px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.98rem;color:var(--ink);font-weight:500}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:100px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:46px;padding:0 16px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.red{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 40%,var(--line))}
.btn.sm{min-height:38px;padding:0 12px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:default}
.grow.btn{flex:1 1 220px}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:0 14px;font-weight:600;font-size:.86rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip svg{width:18px;height:18px;flex:none}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;border:1px solid currentColor}
.pill.ok{color:var(--t-vert)} .pill.ko{color:var(--t-rouge)} .pill.wait{color:var(--t-orange)} .pill.neutral{color:var(--muted)} .pill.ex{color:var(--t-bleu)}
.badge{font-weight:800;font-size:.8rem;letter-spacing:.03em;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:2px 8px}
.badge.pse2{background:var(--accent);color:var(--accent-ink)}

.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.card{text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:grid;gap:8px;box-shadow:var(--shadow);color:var(--ink)}
.card:hover{border-color:var(--brand)}
.card .t{font-weight:700;font-size:1rem;min-width:0;overflow-wrap:anywhere;color:var(--brand)}
.kind{font-weight:700;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);min-height:56px;padding:0 22px 0 18px;font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(227,6,19,.3)}
.fab svg{width:24px;height:24px}

.lines>*{border-top:1px solid var(--line)}
.lines>*:first-child{border-top:0}
.line{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--ink);min-height:58px}
button.line:hover{background:var(--surface-2)}
.line .chev{width:20px;height:20px;color:var(--muted);flex:none}
.av{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex:none}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:grid;gap:6px;text-align:left;color:var(--ink);box-shadow:var(--shadow)}
.tile:hover{border-color:var(--brand)}
.tile .big{font-weight:800;font-size:1.5rem;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1.1}

/* Saisie formative */
.lt{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.lt button{flex:1 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:44px;padding:0 14px;font-weight:700;color:var(--muted);text-align:left;font-size:.85rem}
.lt button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.lt button span{display:block;font-weight:500;font-size:.72rem}
.gh{display:none}
.crit{display:grid;gap:8px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.crit.sub{background:var(--surface-2)}
.crit.sub .cl{padding-left:18px;position:relative;font-weight:500}
.crit.sub .cl::before{content:"";position:absolute;left:4px;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--muted)}
.cl{font-weight:600;min-width:0}
.code{display:inline-block;font-weight:800;font-size:.75rem;color:var(--brand);background:var(--brand-soft);border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.feeds{font-size:.72rem;color:var(--muted);font-weight:500;display:block;margin-top:2px}
.sits{display:grid;gap:2px;margin-top:6px}
.sits .cb{min-height:36px;font-weight:500;font-size:.86rem}
.mk{display:flex;flex-direction:column;gap:4px;min-width:0}
.mk.off{display:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.lv{min-width:52px;height:46px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:1rem;color:var(--tone);padding:0 10px}
.lv.on{background:var(--tone);border-color:var(--tone);color:#fff}
.t-vertf{--tone:var(--t-vertf)} .t-vert{--tone:var(--t-vert)} .t-orange{--tone:var(--t-orange)} .t-rouge{--tone:var(--t-rouge)} .t-bleu{--tone:var(--t-bleu)} .t-gris{--tone:var(--t-gris)}
.legend{display:grid;gap:8px}
.legend div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.legend b.lvb{min-width:42px;text-align:center;border-radius:6px;background:var(--tone);color:#fff;font-size:.9rem;padding:2px 6px}
@media (min-width:760px){
  .lt{display:none}
  .gh{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--n),var(--colw));gap:12px;padding:10px 14px;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .crit{grid-template-columns:minmax(0,1fr) repeat(var(--n),var(--colw));gap:12px}
  .mk.off{display:flex}
  .seg{flex-wrap:nowrap}
}
.slot{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface-2);display:grid;gap:10px}
.slot .r{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) 110px auto;align-items:end}
@media (max-width:520px){.slot .r{grid-template-columns:minmax(0,1fr) 86px auto}}
.slot textarea{min-height:70px}

/* Certificative */
.comp{padding:14px;border-top:1px solid var(--line);display:grid;gap:10px}
.comp:first-child{border-top:0}
.comp .cn{font-weight:800;font-size:1.15rem;color:var(--brand);min-width:22px}
.exp{font-weight:700;font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.pass{display:flex;gap:6px;flex-wrap:wrap}
.pc{position:relative;width:62px;height:56px;border-radius:8px;border:1.5px dashed var(--line);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;color:var(--muted);font-size:.68rem;font-weight:600}
.pc b{font-size:1rem;color:var(--ink);min-height:1.2em;font-weight:800}
.pc.set{border-style:solid;border-color:var(--tone);background:var(--tone);color:#fff}
.pc.set b{color:#fff}
.pc.man::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px var(--ink)}
.hint{flex:1 1 200px}
.yn{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.yn button{border:0;background:var(--surface);min-width:62px;min-height:44px;font-weight:800;font-size:.86rem;letter-spacing:.04em;color:var(--muted)}
.yn button+button{border-left:1px solid var(--line)}
.yn button.on.y{background:var(--t-vert);color:#fff}
.yn button.on.n{background:var(--t-rouge);color:#fff}
.yn button:disabled{cursor:default}
.check{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.letter{width:34px;height:34px;border-radius:7px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem}
@media (max-width:520px){.check{grid-template-columns:auto minmax(0,1fr)}.check .yn{grid-column:2}}
.verdict{border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:2px solid var(--tone);background:color-mix(in srgb,var(--tone) 10%,var(--surface))}
.verdict .big{font-weight:800;font-size:1.7rem;letter-spacing:.04em;color:var(--tone);line-height:1}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper output{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem}
.plist{display:grid;gap:4px;font-size:.82rem;color:var(--muted)}
.plist b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Technicité */
.tgroup>.hd{background:var(--brand);color:var(--brand-ink);border-radius:var(--r) var(--r) 0 0;border-bottom:0}
.tgroup>.hd h3{color:inherit}
.tgroup.pse2>.hd{background:var(--accent);color:var(--accent-ink)}
.titem{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:52px;cursor:pointer}
.titem:first-child{border-top:0}
.titem input{width:26px;height:26px;accent-color:var(--t-vert);flex:none}
.titem.done span{color:var(--muted)}
.titem small{margin-left:auto;color:var(--t-vert);font-weight:700;white-space:nowrap}

/* Éditeurs */
.ed-item{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;background:var(--surface-2)}
.ed-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px}
.ed-row.lvl{grid-template-columns:70px minmax(0,1fr) 130px}
.ed-row.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;align-items:center}
@media (max-width:560px){.ed-row.lvl{grid-template-columns:70px minmax(0,1fr)}.ed-row.lvl select{grid-column:1 / -1}}
.ed-tools{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.subs{display:grid;gap:6px;padding-left:14px;border-left:2px solid var(--line)}
.subs .row{flex-wrap:nowrap}
.cb{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600;min-height:40px}
.cb input{width:22px;height:22px;accent-color:var(--brand);flex:none}
input[type=color]{width:52px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px}

.modal{position:fixed;inset:0;z-index:20;background:rgba(0,29,57,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal .box{background:var(--surface);border-radius:14px;max-width:540px;width:100%;padding:18px;display:grid;gap:10px;max-height:88vh;overflow:auto}
@media (min-width:640px){.modal{align-items:center}}
.modal .ibtn{color:var(--ink)}
.pick{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 14px;display:grid;gap:3px;color:var(--ink);width:100%}
.pick:hover{border-color:var(--brand)}
.pick b{color:var(--brand)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:#001d39;color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px);font-size:.9rem}
.busy{position:fixed;inset:0;z-index:40;background:rgba(0,29,57,.4);display:flex;align-items:center;justify-content:center}
.busy div{background:var(--surface);padding:16px 20px;border-radius:12px;font-weight:600}

@media (prefers-reduced-motion:no-preference){.lv,.pc,.chip,.btn,.card,.tile{transition:background-color .12s,border-color .12s,color .12s}}
</style>

<header class="top" id="top"></header>
<main class="wrap" id="main"></main>
<div id="fabslot"></div>
<nav class="nav" id="nav" aria-label="Navigation principale"></nav>
<div id="overlay"></div>

<script src="vendor/jspdf.umd.min.js"></script>

/* ---------- Un participant : technicité, certification, cas concrets ---------- */
/* certification « virtuelle » pour calculer l'avancement sans créer de fiche */
function certFor(s,pid){const c=certOf(s.id,pid);if(c)return c;const t=certTpl(s.cursus);return t?{id:'',sessionId:s.id,kind:'certificative',pid,tpl:t,overrides:{},extra:0,valid:{},checks:{},condOk:{}}:null}
function compSummary(s,pid){const c=certFor(s,pid);if(!c)return null;const G=certGrid(c,s);const n=c.tpl.criteria.filter(k=>validOf(c,k,G)==='oui').length;return {n,tot:c.tpl.criteria.length,c,G}}
function viewPerson(){
  const s=curSess(),p=participant(s,S.pid);if(!s||!p)return viewSession();
  const x=techOf(s.id,p.id),tt=techTpl(s.cursus),ct=certTpl(s.cursus);
  const ts=x?techStat(x):{n:0,tot:tt?tt.groups.flatMap(g=>g.items).length:0,ok:false};
  const pass=passagesFor(s,p.id),cs=compSummary(s,p.id),c=cs&&cs.c,v=c&&c.id?verdict(c):'';
  const F=sessFormatives(s.id).filter(e=>e.learners.some(l=>l.pid===p.id)).reverse();
  const days=sessDays(s),pr=presenceOf(s,p.id);
  const sits=formTpls(s.cursus).flatMap(t=>t.situations||[]).filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i);
  const seen=id=>pass.some(a=>(a.e.cases||{})[id]);
  const compRows=cs?cs.c.tpl.criteria.map(k=>{const st=compStatus(cs.c,cs.G,k),val=validOf(cs.c,k,cs.G);
    return `<div class="line" style="min-height:48px"><span class="code">${esc(k.code)}</span><span class="grow small">${esc(k.label)}${st.condTxt&&!st.condOk?`<span class="feeds" style="color:var(--t-orange)">${esc(st.condTxt)} : à faire</span>`:''}</span>
      <span class="small num muted">${st.req?`${Math.min(st.count,st.req.n)}/${st.req.n} ${esc(st.req.lvl)}`:''}</span>${val==='oui'?'<span class="pill ok">Validée</span>':val==='non'?'<span class="pill ko">Non</span>':'<span class="pill wait">En cours</span>'}</div>`}).join(''):'';
  return `<div class="stack">
    <div class="tiles">
      ${tt?`<button class="tile" data-act="open-tech"><span class="eyebrow">A · Fiche de technicité</span><span class="big">${ts.n}/${ts.tot}</span><span class="small muted">${ts.ok?'Toutes les techniques sont faites : ligne A validée':'techniques faites'}</span><div class="bar"><i style="width:${ts.tot?Math.round(ts.n/ts.tot*100):0}%"></i></div></button>`:''}
      ${ct?`<button class="tile" data-act="open-cert"><span class="eyebrow">Certification individuelle</span><span class="big" style="color:${v==='apte'?'var(--t-vert)':v==='inapte'?'var(--t-rouge)':'var(--brand)'}">${v==='apte'?'APTE':v==='inapte'?'INAPTE':'En cours'}</span><span class="small muted num">${cs.n}/${cs.tot} compétences validées · ${Math.min(pass.length,ct.passages.max)} passage${pass.length>1?'s':''} (${ct.passages.min} à ${ct.passages.max})</span></button>`:''}
    </div>
    <div class="row"><button class="btn red grow" data-act="new-formative" data-pid="${p.id}">${I.plus}Nouveau cas concret avec ${esc(p.prenom||fullName(p))}</button>${EMBED?'':`<button class="btn primary" data-act="pick-export">${I.pdf}Exporter des fiches</button>`}</div>
    ${cs?`<section class="panel"><div class="hd"><h3>B · Compétences (référentiel)</h3><span class="small muted num">${cs.n}/${cs.tot}</span></div><div class="lines">${compRows}</div></section>`:''}
    ${sits.length?`<section class="panel"><div class="hd"><h3>Situations rencontrées</h3><span class="small muted num">${sits.filter(x=>seen(x.id)).length}/${sits.length}</span></div><div class="bd chips">${sits.map(x=>`<span class="chip ${seen(x.id)?'on':''}" style="cursor:default">${seen(x.id)?'✓ ':''}${esc(x.label)}</span>`).join('')}</div></section>`:''}
    ${ct?(()=>{const n=c?theoryNote(c):null;const ch=ct.checks.find(x=>x.auto==='theory');const dv=c&&c.id&&ch?checkVal(c,ch):'';return `<section class="panel"><div class="hd"><h3>D · Évaluation théorique</h3><span class="small muted">12/20 minimum</span></div><div class="bd row">

function parseNames(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const parts=l.split(/[;\t,]/).map(s=>s.trim()).filter(Boolean);
    if(parts.length>=2)return {nom:parts[0],prenom:parts.slice(1).join(' ')};
    const w=l.split(/\s+/);const up=w.filter(x=>x.length>1&&x===x.toUpperCase()&&/[A-ZÀ-Ý]/.test(x));
    if(up.length&&up.length<w.length)return {nom:up.join(' '),prenom:w.filter(x=>!up.includes(x)).join(' ')};
    return {nom:w[0],prenom:w.slice(1).join(' ')};
  });
}

function trainerOptions(sel,sess){
  const inS=(sess.trainerIds||[]).filter(id=>trainer(id));const others=activeTrainers().filter(t=>!inS.includes(t.id));
  const o=id=>`<option value="${id}" ${sel===id?'selected':''}>${esc(tName(id))}</option>`;
  let h=`<option value="">— Choisir —</option>`;
  if(inS.length)h+=`<optgroup label="Formateurs de la session">${inS.map(o).join('')}</optgroup>`;
  if(others.length)h+=`<optgroup label="Autres formateurs">${others.map(t=>o(t.id)).join('')}</optgroup>`;
  if(sel&&!trainer(sel))h+=`<option value="${esc(sel)}" selected>Formateur supprimé</option>`;
  return h;
}

/* =========================================================

function viewCert(){
  const c=curEval(),s=curSess();if(!c||!s)return viewSessions();
  const t=c.tpl,G=certGrid(c,s),p=participant(s,c.pid),x=techOf(s.id,c.pid);
  const yn=(act,key,val,lock)=>`<div class="yn" role="group">
     <button class="y ${val==='oui'?'on':''}" ${lock==='all'||lock==='oui'?'disabled':`data-act="${act}" data-k="${key}" data-v="oui"`} aria-pressed="${val==='oui'}">OUI</button>
     <button class="n ${val==='non'?'on':''}" ${lock==='all'?'disabled':`data-act="${act}" data-k="${key}" data-v="non"`} aria-pressed="${val==='non'}">NON</button></div>`;
  const comps=t.criteria.map(k=>{const cells=G.cells[k.id];const st=compStatus(c,G,k);const val=validOf(c,k,G);const manual=!!c.valid[k.id];
    const lvl=st.req?scaleOf(t,st.req.lvl):null;
    const prog=st.req?`<b class="num" style="color:${st.count>=st.req.n?'var(--t-vert)':'var(--ink)'}">${Math.min(st.count,st.req.n)}/${st.req.n}</b> validation${st.req.n>1?'s':''} au niveau ${esc(st.req.lvl)}${st.req.lvl!==t.scale[0].code?' ou mieux':''}`:'Niveau d’acquisition non défini';
    const cond=st.condTxt?`<label class="cb small" style="min-height:34px;font-weight:500;color:${st.condOk?'var(--t-vert)':'var(--t-orange)'}"><input type="checkbox" data-act="cond" data-k="${k.id}" ${st.condOk?'checked':''} ${st.condOk&&!st.condManual?'disabled':''}>${esc(st.condTxt)}${st.condOk&&!st.condManual?' : constaté sur un cas concret':st.condManual?' : confirmé par le formateur':' : pas encore constaté'}</label>`:'';
    return `<div class="comp">
      <div class="row" style="align-items:flex-start;flex-wrap:nowrap"><span class="cn">${esc(k.code)}</span><div class="grow" style="font-weight:600">${esc(k.label)}</div>${k.expected?`<span class="exp" title="Nombre de validations et niveau requis">${esc(k.expected)}</span>`:''}</div>
      <div class="pass">${cells.map((v,i)=>{const sc=scaleOf(t,v);
        return `<button class="pc ${sc?'set t-'+sc.tone:''} ${G.manual[k.id][i]?'man':''}" data-act="cell" data-k="${k.id}" data-p="${i}" aria-label="Passage ${i+1} : ${sc?esc(sc.label):'non renseigné'}">N°${String(i+1).padStart(2,'0')}<b>${sc?esc(sc.code):''}</b></button>`}).join('')}</div>
      ${cond}
      <div class="row"><span class="small hint">${prog}</span><span class="small" style="font-weight:600">${manual?'Validée (saisie)':'Validée (auto)'}</span>${yn('valid',k.id,val)}</div>
    </div>`}).join('');
  const plist=G.auto.map((a,i)=>`<div>N°${String(i+1).padStart(2,'0')} : <b>${esc(fmtDate(a.e.date))}</b>${a.l.caseNo?' · cas n°'+esc(a.l.caseNo):''} · ${esc(a.e.theme||'')}</div>`).join('');
  const days=sessDays(s),pr=presenceOf(s,c.pid),th=c.theory||{},note=theoryNote(c);
  const checks=t.checks.map(ch=>{const v=checkVal(c,ch);let note2='',lock='',extra='';
    if(ch.auto==='tech'){const st=x?techStat(x):null;note2=st?`Fiche de technicité : ${st.n}/${st.tot} techniques faites${st.ok?'':' — OUI automatique quand tout est coché'}`:'Fiche de technicité non commencée';lock=st&&st.ok?'all':'oui';if(!x)lock=''}
    else if(ch.auto==='presence'){if(days.length){const n=days.filter(d=>pr[d]).length;note2=`Présence : ${n}/${days.length} jour${days.length>1?'s':''} (${hoursOf(s,days.filter(d=>pr[d]))}/${hoursOf(s,days)} h) — OUI automatique quand toutes les journées sont pointées`;lock=n===days.length?'all':'oui';
        extra=`<div class="chips" style="margin-top:6px">${days.map(d=>`<button class="chip ${pr[d]?'on':''}" data-act="presence" data-pid="${c.pid}" data-d="${d}" aria-pressed="${!!pr[d]}">${esc(dayLabel(s,d))}</button>`).join('')}</div>`}
      else note2='Renseignez les dates de la formation pour pointer la présence'}
    else if(ch.auto==='theory'){note2=note===null?'Saisissez la note du questionnaire (QCM/QROC) : 12/20 minimum':note>=12?'Note ≥ 12/20 : validé':note>=10?'Note de 10 ou 11 : entretien de rattrapage avec le responsable pédagogique':'Note < 10 : pas de rattrapage possible pendant la session';
      if(c.checks[ch.id])note2+=' — décision saisie par le formateur (touchez à nouveau pour revenir au calcul)';lock='';
      extra=`<div class="row" style="margin-top:6px"><label class="f" style="width:130px">Note /20<input type="text" inputmode="decimal" id="c-score" value="${esc(th.score??'')}" placeholder="ex. 14,5" ${bind('theory.score')}></label>
        ${qcmFor(s.cursus)?`<button class="btn sm primary" data-act="open-qcm" style="align-self:end">Corriger le QCM question par question</button>`:`<label class="f" style="width:150px">ou bonnes réponses /40<input type="number" min="0" max="40" id="c-qcm" value="" placeholder="ex. 31" data-act-input="qcm"></label>`}
        ${note!==null&&note>=10&&note<12?`<label class="f" style="min-width:200px">Entretien de rattrapage<select id="c-retake" ${bind('theory.retake')}><option value="">— À faire —</option><option value="ok" ${th.retake==='ok'?'selected':''}>Connaissances suffisantes</option><option value="ko" ${th.retake==='ko'?'selected':''}>Insuffisantes</option></select></label>`:''}</div>`}
    else if(ch.auto){note2='Calculé : toutes les compétences validées';lock='all'}
    return `<div class="check"><span class="letter">${esc(ch.id)}</span><div><div style="font-weight:600">${esc(ch.label)}</div>${note2?`<div class="small muted">${esc(note2)}</div>`:''}${extra}</div>${yn('check',ch.id,v,lock)}</div>`}).join('');
  const v=verdict(c);const vt=v==='apte'?'t-vert':v==='inapte'?'t-rouge':'t-gris';
  const vtext=v==='apte'?'Toutes les conditions sont remplies.':v==='inapte'?'Condition non remplie : '+t.checks.filter(ch=>checkVal(c,ch)==='non').map(ch=>ch.id).join(', ')+'.':'Conditions à renseigner : '+t.checks.filter(ch=>!checkVal(c,ch)).map(ch=>ch.id).join(', ')+'.';
  return `<div class="stack">
    <section class="panel"><div class="bd stack" style="gap:6px">
      <div class="row"><span class="av">${esc(initials(p).toUpperCase())}</span><div class="grow"><b>${esc(fullName(p))}</b><div class="small muted">${esc(t.name)}</div></div></div>
      <div class="small"><span class="muted">Dates de la formation :</span> <b>${esc(fmtDate(s.start))}${s.end?' au '+esc(fmtDate(s.end)):''}</b></div>
      <div class="small"><span class="muted">Formateurs :</span> <b>${esc(sessTrainers(s)||'—')}</b></div>
    </div></section>
    <section class="panel"><div class="hd"><h3>Compétences</h3>
        <span class="small muted">Passages (${t.passages.min} min., ${t.passages.max} max.)</span>
        <span class="stepper"><button class="btn sm" data-act="extra" data-v="-1" ${(c.extra||0)<=0?'disabled':''} aria-label="Retirer un passage manuel">−</button><output class="num">${G.P}</output><button class="btn sm" data-act="extra" data-v="1" ${G.P>=t.passages.max?'disabled':''} aria-label="Ajouter un passage manuel">+</button></span></div>
      <div class="bd stack" style="padding-bottom:0;gap:8px">
        <div class="plist">${plist||'<div>Aucun cas concret enregistré pour ce participant : les passages se rempliront automatiquement.</div>'}${G.dropped?`<div>${G.dropped} cas concret(s) plus ancien(s) non repris (maximum ${t.passages.max} passages).</div>`:''}</div>
        <div class="small muted">Chaque cas concret enregistré devient un passage : le niveau reporté (A, B ou C) est le plus faible des critères liés à la compétence. Une compétence est validée automatiquement quand le nombre de validations du référentiel est atteint au niveau requis (ex. 3B = 3 passages en B ou A). Touchez une case pour la corriger : un point blanc signale une correction.</div>
      </div>
      <div>${comps}</div></section>
    <section class="panel"><div class="hd"><h3>Conditions de validation</h3></div><div>${checks}</div></section>
    <div class="verdict ${vt}"><div><div class="eyebrow">Validation finale</div><div class="big">${v==='apte'?'APTE':v==='inapte'?'INAPTE':'EN ATTENTE'}</div></div><div class="grow small">${esc(vtext)}</div></div>
    <section class="panel"><div class="hd"><h3>Observations</h3></div><div class="bd"><textarea id="c-obs" placeholder="Observations du formateur…" ${bind('observations')}>${esc(c.observations)}</textarea></div></section>
    <div class="row">${EMBED?'':`<button class="btn primary grow" data-act="pdf-cert">${I.pdf}Exporter la fiche en PDF</button>`}<button class="btn danger" data-act="reset-cert">Réinitialiser</button></div>
  </div>`;
}

/* =========================================================
   Fiche de technicité (cases « Fait »)
   ========================================================= */
function techChecklist(x,pse2){return x.tpl.groups.map((gr,gi)=>{const n=gr.items.filter(i=>x.done[i.id]).length;return `<section class="panel tgroup ${pse2?'pse2':''}"><div class="hd"><h3>${esc(gr.title)}</h3><span class="small num">${n}/${gr.items.length}</span><button class="btn sm" data-act="tech-all" data-g="${gi}">${n===gr.items.length?'Tout décocher':'Tout cocher'}</button></div>
      <div>${gr.items.map(it=>`<label class="titem ${x.done[it.id]?'done':''}"><input type="checkbox" data-act="tech" data-i="${it.id}" ${x.done[it.id]?'checked':''}><span>${esc(it.label)}</span>${x.done[it.id]?`<small>Fait ${esc(fmtDate(x.done[it.id]).slice(0,5))}</small>`:''}</label>`).join('')}</div></section>`}).join('')}
function viewTechs(){
  const s=curSess();if(!s)return viewSessions();const tt=techTpl(s.cursus);if(!tt)return '<div class="empty">Aucune fiche de technicité pour cette formation.</div>';
  const parts=s.participants.filter(p=>!p.archived),pse2=/2/.test(s.cursus),sel=S.techPid||'all';
  const X=parts.map(p=>ensureTech(s,p.id)).filter(Boolean);
  const head=`<section class="panel"><div class="bd stack" style="gap:8px">
      <label class="f">Participant<select id="tp-sel" data-bind="techPid" data-scope="ui"><option value="all" ${sel==='all'?'selected':''}>Tous les participants (cocher pour le groupe)</option>${parts.map(p=>{const x=techOf(s.id,p.id),st=x?techStat(x):{n:0,tot:0};return `<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(fullName(p))} · ${st.n}/${st.tot}</option>`}).join('')}</select></label>
      ${sel==='all'?`<div class="small muted">Cocher une technique la valide pour <b>tous</b> les participants (date du jour) ; la décocher la retire à tous. Le compteur indique combien l’ont déjà faite.</div>`:''}</div></section>`;
  if(sel!=='all'){const x=ensureTech(s,sel);if(!x){S.techPid='all';return viewTechs()}S.eid=x.id;const st=techStat(x);
    return `<div class="stack">${head}<section class="panel"><div class="bd row"><b class="grow">${esc(pName(s,sel))}</b><span class="pill ${st.ok?'ok':'wait'} num">${st.n}/${st.tot}</span>${EMBED?'':`<button class="btn sm" data-act="pdf-tech">${I.pdf}PDF</button>`}</div></section>${techChecklist(x,pse2)}</div>`}
  const cnt=id=>X.filter(x=>x.done[id]).length;
  return `<div class="stack">${head}
    ${tt.groups.map((gr,gi)=>{const full=gr.items.every(it=>cnt(it.id)===X.length);return `<section class="panel tgroup ${pse2?'pse2':''}"><div class="hd"><h3>${esc(gr.title)}</h3><button class="btn sm" data-act="techg-all" data-g="${gi}">${full?'Tout décocher pour tous':'Tout cocher pour tous'}</button></div>
      <div>${gr.items.map(it=>{const n=cnt(it.id);return `<label class="titem ${n===X.length?'done':''}"><input type="checkbox" data-act="techg" data-i="${it.id}" ${n===X.length&&X.length?'checked':''}><span>${esc(it.label)}</span><small style="color:${n===X.length?'var(--t-vert)':n?'var(--t-orange)':'var(--muted)'}">${n}/${X.length}</small></label>`}).join('')}</div></section>`}).join('')}
  </div>`;
}

const PT=s=>String(s??'').replace(/[’‘ʼ]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[  ]/g,' ').replace(/œ/g,'oe').replace(/Œ/g,'OE').replace(/→/g,'->').replace(/[^\x20-\x7E -ÿ•\n]/g,'');
const BLACK=[0,0,0],WHITE=[255,255,255],GREY=[90,90,90];
const F_DARK=[68,84,106],F_PEACH=[251,228,214],F_BAND=[132,151,176],F_SHADE=[217,221,228];
function pen(doc){
  const P={
    font(b,s,c,it){doc.setFont('helvetica',b&&it?'bolditalic':b?'bold':it?'italic':'normal');doc.setFontSize(s||9);doc.setTextColor(...(c||BLACK))},
    rect(x,y,w,h,fill,noStroke){doc.setDrawColor(0);doc.setLineWidth(.25);if(fill){doc.setFillColor(...fill);doc.rect(x,y,w,h,noStroke?'F':'FD')}else doc.rect(x,y,w,h)},
    text(t,x,y,o={}){P.font(o.b,o.s,o.c,o.i);doc.text(PT(t),x,y,{align:o.a||'left',baseline:'middle'})},
    cell(t,x,y,w,h,o={}){if(o.box!==false)P.rect(x,y,w,h,o.fill,o.noStroke);P.font(o.b,o.s,o.c,o.i);const pad=o.pad??1.6;
      const lines=doc.splitTextToSize(PT(t),Math.max(2,w-2*pad));const lh=(o.s||9)*.42;const n=Math.min(lines.length,Math.max(1,Math.floor((h-.6)/lh)));
      const y0=y+h/2-(n-1)*lh/2;const ax=o.a==='center'?x+w/2:o.a==='right'?x+w-pad:x+pad;
      for(let i=0;i<n;i++)doc.text(lines[i],ax,y0+i*lh,{align:o.a||'left',baseline:'middle'})},
    lines(t,w,s,b){P.font(b,s);return doc.splitTextToSize(PT(t),w)},
    cross(cx,cy,r){doc.setLineWidth(.5);doc.setDrawColor(0);doc.line(cx-r,cy-r,cx+r,cy+r);doc.line(cx-r,cy+r,cx+r,cy-r);doc.setLineWidth(.25)},
    box(x,y,s,on){doc.setLineWidth(.25);doc.setDrawColor(0);doc.rect(x,y,s,s);if(on){doc.setLineWidth(.45);doc.line(x+.6,y+.6,x+s-.6,y+s-.6);doc.line(x+.6,y+s-.6,x+s-.6,y+.6);doc.setLineWidth(.25)}},
    circle(cx,cy,rx,ry){doc.setLineWidth(.6);doc.setDrawColor(0);doc.ellipse(cx,cy,rx,ry,'S');doc.setLineWidth(.25)}
  };return P;
}

  const chunks=[];for(let i=0;i<idx.length;i+=2)chunks.push(idx.slice(i,i+2));

}
function drawFormative(doc,e,sess,chunk){
  const P=pen(doc),t=e.tpl,H=t.header||{},M=14,W=182,PH=297;let y=12;e.situations=e.situations||{};

  P.cell(e.theme||'',M,y,W,9,{s:9.5,a:'center'});y+=13;

    P.cell('Cas concret n°',M+nw-30,y,16,8,{s:5.5,fill:F_BAND,c:WHITE});P.cell(l.caseNo||'',M+nw-14,y,14,8,{s:9,a:'center',b:true});y+=10});
  const dh=Math.max(18,y-y0-2);P.rect(dx,y0,dw,dh);P.font(true,9);doc.text(PT(fmtDate(e.date)),dx+2,y0+4.5,{baseline:'middle'});
  P.font(false,8);doc.splitTextToSize(PT(evaluatorNames(e)),dw-4).slice(0,3).forEach((ln,i)=>doc.text(ln,dx+2,y0+9.5+i*3.6,{baseline:'middle'}));
  y=Math.max(y,y0+dh)+3;

  const k=t.scale.length,n=chunk.length,cs=8.2,labW=W-cs*k*2;
  P.cell('CRITERES D\'EVALUATION',M,y,labW,11,{b:true,s:8.5,a:'center',fill:F_BAND,c:WHITE});
  for(let j=0;j<2;j++){const x=M+labW+j*cs*k;const li=chunk[j];P.cell(li!==undefined?'APPRENANT N°'+(li+1):'',x,y,cs*k,5.5,{b:true,s:6.5,a:'center',fill:F_BAND,c:WHITE});
    t.scale.forEach((s,q)=>P.cell(s.code,x+q*cs,y+5.5,cs,5.5,{b:true,s:7.5,a:'center'}))}
  y+=11;
  const rows=[];

    if((c.children||[]).length&&c.subMode==='check')rows.push({id:c.id,lab,subs:c.children});

    else{const ls=P.lines((r.sub?'':'')+r.lab,labW-(r.sub?12:3.2),8);h=Math.max(6.2,ls.length*3.5+2.4);
      draw=(yy)=>{P.font(false,8);ls.forEach((ln,i)=>doc.text(ln,M+(r.sub?9:1.6),yy+h/2-(ls.length-1)*1.75+i*3.5,{baseline:'middle'}));if(r.sub){doc.setLineWidth(.25);doc.circle(M+6,yy+h/2,.9,'S')}}}

/* ---- QCM : calcul et questionnaire corrigé ---- */
function qcmState(c,s){const Q=qcmFor(s.cursus);if(!Q)return null;const st=c.qcm||{};const ans=st.ans||{},mark=st.mark||{};
  const res=Q.map(q=>{const a=ans[q.n];if(Array.isArray(a)){const good=q.o.map((o,i)=>o.ok?i:-1).filter(i=>i>=0);return a.length===good.length&&good.every(i=>a.includes(i))?'ok':'ko'}return mark[q.n]||''});
  const ok=res.filter(r=>r==='ok').length,done=res.filter(Boolean).length;return {Q,res,ok,done,tot:Q.length,score:Math.round(ok*20/Q.length*2)/2}}
function qcmToScore(c){const s=curSess(),st=qcmState(c,s);c.theory=c.theory||{};if(st.done){c.theory.score=String(st.score).replace('.',',');c.theory.src='qcm'}else if(c.theory.src==='qcm'){delete c.theory.score;delete c.theory.src}touch(c)}
function qcmPages(c,s){const st=qcmState(c,s);if(!st||!st.done)return [];const p=participant(s,c.pid)||{};const pages=[];

      P.cell('EVAL/ '+s.cursus,M+lw+cw,y,rw,6.7,{s:7,a:'center'});P.cell('Correction',M+lw+cw,y+6.7,rw,6.7,{s:7,a:'center'});P.cell('Note : '+String(st.score).replace('.',',')+' / 20',M+lw+cw,y+13.4,rw,6.6,{s:8,b:true,a:'center'});y+=25;
      P.cell('NOM / PRÉNOM : '+fullName(p),M,y,W*.5,7,{s:9,b:true});P.cell('DATE DE LA FORMATION : '+fmtDate(s.start)+(s.end?' au '+fmtDate(s.end):''),M+W*.5,y,W*.5,7,{s:8});y+=10;
      P.font(false,6.8,GREY);doc.splitTextToSize(PT(`${st.ok} bonne${st.ok>1?'s':''} réponse${st.ok>1?'s':''} sur ${st.tot} questions. Barème : une question est juste si toutes les bonnes réponses, et seulement elles, sont cochées. Case cochée = réponse du stagiaire ; (ok) = bonne réponse du corrigé.`),W).forEach(ln=>{doc.text(ln,M,y);y+=3});y+=2}
    for(;i<st.Q.length;i++){const q=st.Q[i],a=((c.qcm||{}).ans||{})[q.n];const lines=P.lines(q.n+'. '+q.q,W-24,8.4,true);
      const ols=q.o.map(o=>P.lines(o.t,W-30,7.8));const h=lines.length*3.6+ols.reduce((t,l)=>t+l.length*3.3+.7,0)+3;
      if(y+h>287){return i}
      P.font(true,8.4);lines.forEach((ln,j)=>doc.text(ln,M,y+3+j*3.6));
      const r=st.res[i];P.text(r==='ok'?'JUSTE':r==='ko'?'FAUX':'—',M+W,y+3,{s:8,b:true,a:'right',c:r==='ok'?[30,120,50]:r==='ko'?[180,20,30]:GREY});
      let yy=y+3+lines.length*3.6;
      q.o.forEach((o,k)=>{const on=Array.isArray(a)&&a.includes(k);P.box(M+4,yy-1.6,2.8,on);P.font(o.ok,7.8,o.ok?[0,43,107]:BLACK);ols[k].forEach((ln,j)=>doc.text(ln,M+10,yy+.5+j*3.3));if(o.ok)P.text('(ok)',M+W,yy+.5,{s:7,a:'right',c:[30,120,50]});yy+=ols[k].length*3.3+.7});
      y=yy+2;doc.setDrawColor(215);doc.line(M,y-1,M+W,y-1);doc.setDrawColor(0)}
    return i};
  // pagination : on mesure avec un document témoin
  const J=window.jspdf.jsPDF;const probe=new J({unit:'mm',format:'a4'});let from=0,guard=0;const starts=[];
  while(from<st.Q.length&&guard++<10){starts.push(from);const nx=draw(probe,from);probe.addPage();from=nx}

function b64(u8){let s='';const C=0x8000;for(let i=0;i<u8.length;i+=C)s+=String.fromCharCode.apply(null,u8.subarray(i,i+C));return btoa(s)}
async function shareFiles(files,title){
  if(NATIVE){
    const Pl=window.Capacitor.Plugins;const uris=[];
    for(const f of files){const txt=typeof f.data==='string';
      const r=await Pl.Filesystem.writeFile({path:'exports/'+f.name,data:txt?f.data:b64(f.data),directory:'CACHE',recursive:true,...(txt?{encoding:'utf8'}:{})});uris.push(r.uri)}
    try{await Pl.Share.share({title,files:uris,dialogTitle:title})}catch(err){if(!/cancel/i.test(String(err&&err.message||err)))throw err}
    return;
  }
  const fl=files.map(f=>new File([f.data],f.name,{type:f.mime}));
  if(navigator.canShare&&navigator.share){try{if(navigator.canShare({files:fl})){await navigator.share({files:fl,title});return}}catch(err){if(err&&err.name==='AbortError')return}}
  downloadFiles(fl);
}
function downloadFiles(fl){
  fl.forEach((f,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)},i*350));
  toast(fl.length>1?`${fl.length} fichiers enregistrés dans Téléchargements`:'Enregistré dans Téléchargements : '+fl[0].name);
}
/* Enregistrement sur l'appareil : Documents/Eval-PSE/<formation>/ (Android) ou Téléchargements (navigateur) */
async function saveFiles(files,folder){
  if(!NATIVE){downloadFiles(files.map(f=>new File([f.data],f.name,{type:f.mime})));return}
  const Pl=window.Capacitor.Plugins;const dir='Eval-PSE/'+slug(folder||'exports');
  try{try{await Pl.Filesystem.requestPermissions()}catch(e){}
    for(const f of files){const txt=typeof f.data==='string';
      await Pl.Filesystem.writeFile({path:dir+'/'+f.name,data:txt?f.data:b64(f.data),directory:'DOCUMENTS',recursive:true,...(txt?{encoding:'utf8'}:{})})}
    toast(`${files.length>1?files.length+' fichiers enregistrés':'Enregistré'} dans Documents/${dir}`);
  }catch(err){console.error(err);toast('Enregistrement direct impossible : choisissez « Enregistrer » ou « Fichiers » dans le menu');await shareFiles(files,'Enregistrer')}
}

  if(kind==='all')return one('dossiers-complets',parts.flatMap(p=>dossierPages(s,p.id)),'aucune fiche');

  if(kind==='techs')return one('technicite',parts.map(p=>ensureTech(s,p.id)).filter(Boolean).flatMap(x=>techPages(x,s)),'aucune fiche de technicité');
  if(kind==='certs')return one('certifications',parts.map(p=>ensureCert(s,p.id)).filter(Boolean).flatMap(c=>certPages(c,s)),'aucune fiche de certification');
  if(kind==='dossiers'){const files=parts.map(p=>{const pg=dossierPages(s,p.id);return pg.length?pdfFile(`${s.cursus}_dossier_${pslug(s,p.id)}`,pg):null}).filter(Boolean);if(!files.length)throw new Error('aucun participant');return {files,title:s.title}}

function backupJSON(sids){

function csv(sids){
  const q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[['formation','type','session','date','fiche','participant','evaluateurs','theme','code','intitule','valeur']];
  DB.sessions.filter(s=>!sids||sids.includes(s.id)).forEach(s=>{
    sessFormatives(s.id).forEach(e=>{const it=items(e.tpl);e.learners.forEach(l=>{it.forEach(x=>rows.push([s.title,s.cursus,s.id,e.date,'formative',pName(s,l.pid),evaluatorNames(e),e.theme,x.code,x.label,l.marks[x.id]||'']));if(l.obs)rows.push([s.title,s.cursus,s.id,e.date,'formative',pName(s,l.pid),evaluatorNames(e),e.theme,'OBS','Observations',l.obs])})});
    s.participants.filter(p=>!p.archived).forEach(p=>{const who=fullName(p);
      const x=techOf(s.id,p.id);if(x)x.tpl.groups.forEach(g=>g.items.forEach(it=>rows.push([s.title,s.cursus,s.id,x.done[it.id]||'','technicite',who,'','',g.title,it.label,x.done[it.id]?'FAIT':''])));
      const c=certOf(s.id,p.id);if(!c)return;const G=certGrid(c,s);
      c.tpl.criteria.forEach(k=>{G.cells[k.id].forEach((v,i)=>rows.push([s.title,s.cursus,s.id,'','certificative',who,'','',k.code,k.label+' - passage '+(i+1),v]));rows.push([s.title,s.cursus,s.id,'','certificative',who,'','',k.code,k.label+' - validée',validOf(c,k,G)])});
      c.tpl.checks.forEach(ch=>rows.push([s.title,s.cursus,s.id,'','certificative',who,'','',ch.id,ch.label,checkVal(c,ch)]));
      if(theoryNote(c)!==null)rows.push([s.title,s.cursus,s.id,'','certificative',who,'','','QCM','Note évaluation théorique /20',(c.theory||{}).score]);
      rows.push([s.title,s.cursus,s.id,'','certificative',who,'','','FINAL','Validation finale',verdict(c)])});
  });
  return '﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
}

function importData(txt){
  let d;try{d=JSON.parse(txt)}catch(e){toast('Ce fichier n’est pas une sauvegarde valide');return}

  const up=(arr,x,check)=>{if(!x||!check(x))return 0;const i=arr.findIndex(y=>y.id===x.id);if(i>=0)arr[i]=x;else arr.push(x);return 1};
  (d.templates||(d.kind?[d]:[])).forEach(t=>nt+=up(DB.templates,t,t=>t.kind&&(Array.isArray(t.criteria)||Array.isArray(t.groups))));
  (d.trainers||[]).forEach(t=>nf+=up(DB.settings.trainers,t,t=>t.id));
  (d.sessions||[]).forEach(s=>ns+=up(DB.sessions,s,s=>Array.isArray(s.participants)));
  (d.evals||[]).forEach(e=>ne+=up(DB.evals,e,e=>e.tpl&&e.kind&&e.sessionId));
  if(!nt&&!ns&&!ne&&!nf){toast('Rien de reconnu dans ce fichier');return}
  save(true);toast(`Importé : ${ns} formation(s), ${ne} fiche(s), ${nf} formateur(s), ${nt} grille(s)`);render();
}

  'toggle-done':()=>{const e=curEval();if(!e.done&&e.learners.some(l=>!l.pid)){toast('Choisissez chaque apprenant avant d’enregistrer');return}e.done=!e.done;touch(e);save(true);

  cell:d=>{const c=curEval(),s=curSess(),t=c.tpl,G=certGrid(c,s),p=+d.p;const codes=['',...t.scale.map(x=>x.code)];const cur=G.cells[d.k][p]||'';

  'techg-all':d=>{const s=curSess();const X=s.participants.filter(p=>!p.archived).map(p=>ensureTech(s,p.id)).filter(Boolean);const gr=techTpl(s.cursus).groups[+d.g];

  'qcm-mark':d=>{const c=curEval();c.qcm=c.qcm||{};c.qcm.mark=c.qcm.mark||{};c.qcm.ans=c.qcm.ans||{};delete c.qcm.ans[d.n];if(c.qcm.mark[d.n]===d.v)delete c.qcm.mark[d.n];else c.qcm.mark[d.n]=d.v;qcmToScore(c);render()},

  'blank-tpl':d=>{closeModal();S.tdraft=blankTemplate(d.v,S.tplCur!=='all'?S.tplCur:'');S.tdraftNew=true;go('tpl')},
  'edit-tpl':d=>{S.tdraft=clone(DB.templates.find(t=>t.id===d.id));S.tdraftNew=false;go('tpl')},

  'del-tpl':d=>{const t=DB.templates.find(x=>x.id===d.id);confirmBox(`Supprimer la grille « ${t.name} » ? Les fiches déjà remplies sont conservées.`,'Supprimer',()=>{DB.templates=DB.templates.filter(x=>x.id!==d.id);if(t.builtin)(DB.removedBuiltins=DB.removedBuiltins||[]).push(t.id);save(true);render();toast('Grille supprimée')})},
  'tpl-cancel':()=>{S.tdraft=null;go('tpls')},
  'tpl-save':()=>{const d=S.tdraft;d.cursus=(d.cursus||'').trim().toUpperCase();
    if(!d.cursus){toast('Indiquez la formation (ex. PSE1)');return}
    if(!d.name.trim()){toast('Donnez un nom à la grille');return}
    const dupKind=['certificative','technicite'].includes(d.kind)&&DB.templates.find(t=>t.kind===d.kind&&t.cursus===d.cursus&&t.id!==d.id);
    if(dupKind){toast(`Il existe déjà une fiche ${KIND[d.kind].toLowerCase()} ${d.cursus}`);return}
    if(d.kind==='technicite'){d.groups=d.groups.map(g=>({...g,items:g.items.filter(i=>i.label.trim())})).filter(g=>g.title.trim()||g.items.length);if(!d.groups.length){toast('Ajoutez au moins une rubrique');return}}
    else{
      if(!d.scale.length||d.scale.some(s=>!String(s.code).trim())){toast('Chaque niveau doit avoir un code');return}
      if(new Set(d.scale.map(s=>s.code)).size!==d.scale.length){toast('Deux niveaux ont le même code');return}
      if(!d.criteria.length){toast('Ajoutez au moins un critère');return}
      if(d.kind==='formative')d.learners=Math.min(6,Math.max(1,parseInt(d.learners)||1));
      else{let mn=parseInt(d.passages.min)||1,mx=parseInt(d.passages.max)||mn;mn=Math.max(1,Math.min(12,mn));mx=Math.max(mn,Math.min(12,mx));d.passages={min:mn,max:mx};
        d.checks.forEach(c=>{if(c.auto==='true')c.auto=true;else if(c.auto==='false')c.auto=false});
        if(!d.scale.some(s=>s.result==='ok')||!d.scale.some(s=>s.result==='ko')){toast('Il faut un résultat « Acquis » et un « Non acquis »');return}
        if(!d.checks.length){toast('Ajoutez au moins une condition');return}
        if(new Set(d.checks.map(c=>c.id)).size!==d.checks.length){toast('Deux conditions ont la même lettre');return}}}
    if(d.builtin)d.edited=true;
    const i=DB.templates.findIndex(t=>t.id===d.id);if(i>=0)DB.templates[i]=d;else DB.templates.push(d);
    save(true);S.tdraft=null;go('tpls');toast('Grille enregistrée')},

    if(used)t.archived=true;else DB.settings.trainers.splice(+d.i,1);save(true);render();if(used)toast('Formateur retiré des listes ; il reste affiché sur ses fiches')},
  backup:()=>runExport('Préparation…',()=>({files:[{name:`evaluations-pse_sauvegarde_${today()}.json`,mime:'application/json',data:backupJSON()}],title:'Sauvegarde Évaluations PSE'})),
  'csv-all':()=>runExport('Préparation…',()=>({files:[{name:`evaluations-pse_resultats_${today()}.csv`,mime:'text/csv',data:csv()}],title:'Résultats'})),
  'copy-json':()=>copyText(backupJSON()),
  import:()=>{const f=$('#imp-file').files[0];const txt=$('#imp-text').value.trim();
    if(f){const r=new FileReader();r.onload=()=>importData(String(r.result));r.readAsText(f)}else if(txt)importData(txt);else toast('Choisissez un fichier ou collez une sauvegarde')},
  restore:()=>{DB.removedBuiltins=[];builtinTemplates().forEach(b=>{const i=DB.templates.findIndex(t=>t.id===b.id);if(i>=0)DB.templates[i]=b;else DB.templates.push(b)});save(true);render();toast('Grilles PSE1 et PSE2 restaurées')},
  'del-samples':()=>{const ids=DB.sessions.filter(s=>s.sample).map(s=>s.id);DB.sessions=DB.sessions.filter(s=>!s.sample);DB.evals=DB.evals.filter(e=>!ids.includes(e.sessionId));
    DB.settings.trainers=DB.settings.trainers.filter(t=>!t.sample);save(true);render();toast(ids.length?'Exemples supprimés':'Aucun exemple à supprimer')},
  wipe:()=>confirmBox('Effacer toutes les formations, fiches, formateurs et grilles de cet appareil ?','Tout effacer',()=>{DB=emptyDB();save(true);render();toast('Données effacées')})
};

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;
  if(el.tagName==='INPUT'&&ev.type==='click'&&el.type==='checkbox'){/* traité sur change */return}
  const f=A[el.dataset.act];if(f)f(el.dataset,ev,el);
});
function applyBind(el){
  const p=el.dataset.bind,sc=el.dataset.scope;let v=el.type==='checkbox'?el.checked:el.value;
  if(sc==='ui'){S[p]=v;return 'ui'}
  if(sc==='settings'){setPath(DB.settings,p,v);save();if(p==='extraSkills')render();return}
  if(sc==='sdraft'){if(p.startsWith('fc.'))S.draft.fc=S.draft.fc||{};if(/^days\.\d+\.h$/.test(p))v=v===''?'':Number(v);setPath(S.draft,p,v);
    if(p==='type'||p==='cursus'||p==='start'){if(!S.draft.daysTouched){S.draft.days=defaultDays(S.draft)}render()}else if(p.startsWith('days.')){S.draft.daysTouched=true}return}
  if(sc==='theory'){const se=curSess(),c=ensureCert(se,el.dataset.pid);if(c){c.theory=c.theory||{};c.theory.score=v;if(c.theory.src==='qcm')delete c.theory.src;touch(c)}return 'theory'}
  if(sc==='part'){const se=curSess(),pp=participant(se,S.pid);if(pp){setPath(pp,p,v);se.updatedAt=Date.now();save()}return}
  if(sc==='sess'){const se=curSess();if(se){if(p.startsWith('fc.'))se.fc=se.fc||{};setPath(se,p,v);se.updatedAt=Date.now();save()}return}
  if(sc==='tdraft'){if(el.type==='number')v=v===''?'':Number(v);setPath(S.tdraft,p,v);return}
  const e=curEval();if(!e)return;if(p.startsWith('theory.'))e.theory=e.theory||{};setPath(e,p,v);touch(e);
}
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.svWhy!==undefined&&S.surveyDraft){S.surveyDraft.why[el.dataset.svWhy]=el.value;return}
  if(el.dataset&&el.dataset.svComment&&S.surveyDraft){S.surveyDraft.comment=el.value;return}if(!el.dataset||!el.dataset.bind||el.tagName==='SELECT'||el.type==='checkbox')return;
  if(applyBind(el)==='ui'){const pos=el.selectionStart;render();const n=$('#q');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
});
document.addEventListener('change',ev=>{
  const el=ev.target;if(!el.dataset)return;
  if(el.dataset.actInput==='qcm'){const n=parseInt(el.value,10);if(!isNaN(n)){const c=curEval();c.theory=c.theory||{};c.theory.score=String(Math.max(0,Math.min(40,n))/2).replace('.',',');touch(c);render();toast(`${n}/40 bonnes réponses = ${c.theory.score}/20`)}return}
  if(el.dataset.act&&el.type==='checkbox'){const f=A[el.dataset.act];if(f)f(el.dataset,ev,el);return}
  if(!el.dataset.bind)return;
  if(el.id==='c-score'||el.dataset.scope==='theory'){render();return}
  if(el.tagName==='SELECT'||el.type==='checkbox'){applyBind(el);if(el.dataset.scope==='eval'||el.dataset.scope==='ui'||(el.dataset.scope==='tdraft'&&/subMode|auto/.test(el.dataset.bind)))render()}
  else if(el.dataset.scope==='tdraft'&&el.dataset.bind==='cursus')render();
});
document.addEventListener('toggle',ev=>{const el=ev.target;if(el.dataset&&el.dataset.panel)S.open[el.dataset.panel]=el.open},true);
window.addEventListener('pagehide',()=>save(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true)});
/* Bouton retour Android */
if(NATIVE&&window.Capacitor.Plugins.App){window.Capacitor.Plugins.App.addListener('backButton',()=>{
  if($('#overlay').innerHTML){closeModal();return}
  const m={session:'sessions',person:'session',sessionEdit:S.draftNew?'sessions':'session',formative:S.pid?'person':'session',cert:'person',tech:'person',techs:'session',qcm:'cert',satis:'session',survey:'session',tpl:'tpls'};
  if(m[S.view])go(m[S.view]);else if(S.view!=='sessions'){S.tab='sessions';go('sessions')}else window.Capacitor.Plugins.App.exitApp();
})}
window.__loadForms=loadForms;
window.__app={DB:()=>DB,S,A,go,qcmState,pvPages,certificatePages,notifPages,attestationPages,satPages,qcmPages,buildPdf,formativePages,certPages,techPages,dossierPages,sessionExport,certGrid};
render();
})();
</script>
